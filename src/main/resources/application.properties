spring.application.name=User-grp-API-HACKATON

# In-memory database configuration for local development and testing
spring.datasource.url=jdbc:h2:mem:usergrpdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Enable the H2 console for easy inspection (accessible at /h2-console)
spring.h2.console.enabled=true
